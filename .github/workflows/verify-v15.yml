name: Verify GeoStats v15

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: geostats-v15-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify v15 review workbench
        run: npm run test-v15
      - name: Run core invariants
        run: npm test
      - name: Run importer unit tests
        run: npm run test-importers
      - name: Run source-policy fixtures
        run: npm run test-player-links && npm run test-source-integrity
      - name: Build production app
        run: npm run build
