name: v16.2.7 authoritative sports recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/import-sports-history.py'
      - 'scripts/test-sports-history-importer.py'
      - '.github/workflows/v16-2-7-sports-recovery.yml'

permissions:
  contents: read

concurrency:
  group: geostats-v16-2-7-production-catalog
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  import-audit-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require production warehouse credentials
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL secret is missing"; exit 1; }
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}" || { echo "::error::Supabase service-role secret is missing"; exit 1; }
      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-data-importers.txt
      - name: Test sports chronology importer
        run: python scripts/test-sports-history-importer.py
      - name: Capture exact official FIFA snapshot fail closed
        run: |
          mkdir -p artifacts/source-integrity/fifa
          python -c "import runpy; runpy.run_path('scripts/import-sports-history.py')['write_live_fifa_snapshot']('artifacts/source-integrity/fifa/official-fifa-world-cup-history.csv')"
      - name: Import exact official FIFA snapshot fail closed
        run: >-
          python scripts/import-sports-history.py
          --source fifa
          --fifa-input artifacts/source-integrity/fifa/official-fifa-world-cup-history.csv
      - name: Independently audit exact official FIFA snapshot
        env:
          FIFA_WORLD_CUP_INPUT: artifacts/source-integrity/fifa/official-fifa-world-cup-history.csv
        run: >-
          python scripts/audit-source-integrity.py
          --source fifa
          --include-nonplayable
          --fail-on-source-error
          --fail-on-empty
          --report-dir artifacts/source-integrity/fifa
      - name: Stage strict-pass sports candidate without publishing
        run: python scripts/stage-v16-2-7-catalog.py
      - name: Upload source-integrity evidence and official snapshot
        uses: actions/upload-artifact@v7
        with:
          name: source-integrity-fifa-v16-2-7
          path: artifacts/source-integrity/fifa
          if-no-files-found: error
          retention-days: 30
