name: v16.2.7 one-shot recovery and reachability proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v16-2-7-recovery-once.yml'

permissions:
  contents: read

concurrency:
  group: geostats-v16-2-7-recovery-once
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  recover-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require production warehouse credentials
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL secret is missing"; exit 1; }
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}" || { echo "::error::Supabase service-role secret is missing"; exit 1; }
      - name: Install dependencies
        run: |
          npm ci --include=dev --no-audit --no-fund
          python -m pip install --disable-pip-version-check \
            -r scripts/requirements-data-importers.txt \
            -r scripts/requirements-faostat.txt \
            -r scripts/requirements-geography.txt
      - name: Refresh and independently audit self-fetching official source families
        shell: bash
        run: |
          set -euo pipefail
          run_source() {
            local slug="$1"; shift
            echo "::group::Import $slug"
            "$@"
            echo "::endgroup::"
            python scripts/audit-source-integrity.py --source "$slug" --include-nonplayable --fail-on-source-error --fail-on-empty --report-dir "artifacts/source-integrity/$slug"
          }
          run_source naturalearth python scripts/import-natural-earth.py
          run_source unmembership python scripts/import-historical-categories.py --source unmembership --require-complete
          run_source constitute python scripts/import-historical-categories.py --source constitute
          run_source ipu python scripts/import-historical-categories.py --source ipu --require-complete
          run_source worldbankhistory python scripts/import-historical-categories.py --source worldbankhistory --require-complete
          run_source unwpp python scripts/import-un-wpp.py
          run_source worldbankclimate python scripts/import-world-bank-climate.py
          run_source naturalearthcapitals python scripts/import-natural-earth-capitals.py
          run_source unescoich python scripts/import-unesco-ich.py
          run_source worldbankinfra python scripts/import-world-bank-infrastructure.py
      - name: Stage strict-pass candidates without publishing
        run: python scripts/stage-v16-2-7-catalog.py
      - name: Write production-solver reachability and diversity evidence
        id: reachability
        continue-on-error: true
        run: node scripts/audit-v16-2-7-reachability.cjs --write --anchor-samples=30000
      - name: Report reachability outcome
        run: echo "Reachability audit outcome: ${{ steps.reachability.outcome }} (publication intentionally not attempted by this one-shot workflow)."
      - name: Upload source audit evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: geostats-v16-2-7-one-shot-source-audits
          path: artifacts/source-integrity
          retention-days: 30
          if-no-files-found: warn
