ame: Recover v16.2.4 audited catalog

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geostats-v16-2-4-catalog-recovery
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all source credentials
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL secret is missing"; exit 1; }
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}" || { echo "::error::Supabase service-role secret is missing"; exit 1; }
          test -n "$COMTRADE_API_KEY" || { echo "::error::COMTRADE_API_KEY secret is missing. The catalog will not be published without a real Comtrade audit."; exit 1; }

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install repository dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --include=dev --no-audit --no-fund
          else
            echo "::warning::package-lock.json is absent; using npm install. Run Generate v16.2.4 package lock, commit the artifact, then rerun for locked dependency verification."
            npm install --include=dev --no-audit --no-fund
          fi
          python -m pip install --disable-pip-version-check \
            -r scripts/requirements-data-importers.txt \
            -r scripts/requirements-faostat.txt \
            -r scripts/requirements-geography.txt
      - name: Test v16.2.4 catalog cleanup, historical importers, generator, and one-catalog policy
        run: npm run test-v16-2-4

  recover:
    needs: [preflight, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: World Bank legacy catalog
            command: python scripts/recover-world-bank-catalog.py --refresh-values
            geography: false
            audit_slug: ""
          - name: FAOSTAT production and livestock populations
            command: python scripts/import-faostat.py --report-dir artifacts/source-integrity/faostat
            geography: false
            audit_slug: faostat
          - name: WHO health catalog
            command: python scripts/import-who.py
            geography: false
            audit_slug: ""
          - name: UN Comtrade exports
            command: python scripts/import-comtrade.py --refresh-existing --require-complete
            geography: false
            audit_slug: ""
          - name: UNHCR displacement
            command: python scripts/import-unhcr.py
            geography: false
            audit_slug: ""
          - name: Natural Earth geography
            command: python scripts/import-natural-earth.py
            geography: true
            audit_slug: ""
          - name: Pew religion
            command: python scripts/import-pew-religion.py
            geography: false
            audit_slug: ""
          - name: FAOSTAT Food Balances
            command: python scripts/import-faostat-food-balances.py
            geography: false
            audit_slug: ""
          - name: Smithsonian volcanoes
            command: python scripts/import-smithsonian-volcanoes.py
            geography: false
            audit_slug: ""
          - name: USGS earthquakes
            command: python scripts/import-usgs-earthquakes.py
            geography: true
            audit_slug: ""
          - name: UN membership history
            command: python scripts/import-historical-categories.py --source unmembership --require-complete
            geography: false
            audit_slug: ""
          - name: Constitute constitutional history
            command: python scripts/import-historical-categories.py --source constitute --require-complete
            geography: false
            audit_slug: ""
          - name: IPU independence and universal suffrage history
            command: python scripts/import-historical-categories.py --source ipu --require-complete
            geography: false
            audit_slug: ""
          - name: World Bank broad historical milestones
            command: python scripts/import-historical-categories.py --source worldbankhistory --require-complete
            geography: false
            audit_slug: ""
    name: Recover ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install importer dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r scripts/requirements-data-importers.txt \
            -r scripts/requirements-faostat.txt
          if [ "${{ matrix.geography }}" = "true" ]; then
            python -m pip install --disable-pip-version-check -r scripts/requirements-geography.txt
          fi
      - name: Refresh official source data
        run: ${{ matrix.command }}
      - name: Upload integrated FAOSTAT QCL audit
        if: ${{ matrix.audit_slug != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: geostats-v16-2-4-source-audit-${{ matrix.audit_slug }}
          path: artifacts/source-integrity/${{ matrix.audit_slug }}
          retention-days: 30
          if-no-files-found: error

  audit:
    needs: recover
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        source: [worldbank, who, comtrade, unhcr, naturalearth, pew, faostatfbs, smithsonian, usgs, unmembership, constitute, ipu, worldbankhistory]
    name: Audit ${{ matrix.source }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r scripts/requirements-data-importers.txt \
            -r scripts/requirements-faostat.txt \
            -r scripts/requirements-geography.txt
      - name: Recalculate official-source values, coverage, and rankings
        run: >-
          python scripts/audit-source-integrity.py
          --source ${{ matrix.source }}
          --include-nonplayable
          --fail-on-source-error
          --fail-on-empty
          --report-dir artifacts/source-integrity/${{ matrix.source }}
      - name: Upload source audit
        uses: actions/upload-artifact@v7
        with:
          name: geostats-v16-2-4-source-audit-${{ matrix.source }}
          path: artifacts/source-integrity/${{ matrix.source }}
          retention-days: 30
          if-no-files-found: error

  finalize:
    needs: [preflight, tests, recover, audit]
    if: ${{ always() && needs.preflight.result == 'success' && needs.tests.result == 'success' && needs.recover.result == 'success' && needs.audit.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install finalization dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-data-importers.txt
      - name: Vet newly imported candidates
        run: python scripts/vet-expanded-catalog.py --source expansion
      - name: Export guarded pre-promotion audit and dry run
        run: python scripts/export-v16-2-category-audit.py --phase pre --release-version 16.2.4
      - name: Apply conservative promotions and publish one shared gameplay catalog
        run: python scripts/finalize-v16-catalog.py --release-version 16.2.4
      - name: Export final audit and applied decisions
        run: python scripts/export-v16-2-category-audit.py --phase final --release-version 16.2.4
      - name: Upload v16.2.4 catalog audit
        uses: actions/upload-artifact@v7
        with:
          name: geostats-v16-2-4-category-audit
          path: |
            category-audit-pre-promotion-v16-2-4.csv
            category-promotion-dry-run-v16-2-4.csv
            category-audit-pre-promotion-v16-2-4-summary.json
            category-audit-v16-2-4.csv
            category-promotion-final-v16-2-4.csv
            category-audit-v16-2-4-summary.json
          retention-days: 30
          if-no-files-found: error


