name: Inspect FIFA ranking records

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v16-2-7-inspect-fifa-ranking.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print ranking and qualifier records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,json,re,urllib.request
          for code in ['ENG','GER','IND','BRA','USA','SCO','WAL','NIR','FRA','AFG']:
              url=f'https://inside.fifa.com/en/associations/{code}'
              req=urllib.request.Request(url,headers={'User-Agent':'GeoStats/16.2.7 source validation'})
              with urllib.request.urlopen(req,timeout=30) as r: page=r.read().decode('utf-8','replace')
              m=re.search(r'<script[^>]+id=["\']__NEXT_DATA__["\'][^>]*>(.*?)</script>',page,re.S|re.I)
              d=json.loads(html.unescape(m.group(1)))['props']['pageProps']['association']['pageData']
              rr=d.get('memberAssociationsGroupedRankingProps',{}).get('footballCountryRankings',{}).get('countryRankingSection',{}).get('rankings',{}).get('menRanking',{}).get('rows',[])
              row=rr[0] if rr else {}
              simple={k:v for k,v in row.items() if isinstance(v,(str,int,float,bool,type(None)))}
              tours=d.get('honoursBestPerformances',{}).get('tournaments',[])
              qual=next((x for x in tours if x.get('tournamentKey')=='FIFAWorldCupQualification-Men'),{})
              wc=next((x for x in tours if x.get('tournamentKey')=='FIFAWorldCup-Men'),{})
              print(code,'RANK',simple,'QUAL',{k:qual.get(k) for k in ['participationsCount','lastAppearance']},'WC',{k:wc.get(k) for k in ['participationsCount','participationsYears','bestPerformanceStage']})
          PY