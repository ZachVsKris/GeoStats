name: Import Pew religion candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-pew-religion.yml'
      - 'scripts/import-pew-religion.py'
      - 'scripts/test-pew-religion-importer.py'

permissions:
  contents: write

jobs:
  validate-and-repair:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fix official percentage-sheet scaling
        id: patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/import-pew-religion.py')
          text=p.read_text()
          old='''            if measure == "share":\n                value=_as_percent(row[col])'''
          new='''            if measure == "share":\n                value=_as_number(row[col]) if source_kind == "percentages" else _as_percent(row[col])\n                if value is not None and not 0 <= value <= 100: value=None'''
          changed=False
          if old in text:
              p.write_text(text.replace(old,new,1)); changed=True
          elif new not in text:
              raise SystemExit('Expected Pew percentage parsing block not found')
          with open(Path(__import__('os').environ['GITHUB_OUTPUT']),'a') as out:
              out.write(f"changed={'true' if changed else 'false'}\n")
          PY
      - name: Install dependencies
        run: pip install -r scripts/requirements-data-importers.txt
      - name: Run exact-layout importer fixtures
        run: PYTHONPATH=scripts python scripts/test-pew-religion-importer.py
      - name: Validate exact live Pew release without writing
        run: PYTHONPATH=scripts python scripts/import-pew-religion.py --dry-run
      - name: Verify known first-party Pew values and units
        shell: bash
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('scripts/import-pew-religion.py')
          spec=importlib.util.spec_from_file_location('pew',p); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          rows=m.PewReligionImporter(None,dry_run=True).rows()
          by={r['iso3']:r for r in rows}
          mng=float(by['MNG']['unaffiliated_share'])
          chn_other=float(by['CHN']['other_religions_population'])
          ind_other=float(by['IND']['other_religions_population'])
          chn_unaff=float(by['CHN']['unaffiliated_population'])
          max_other=max(float(r['other_religions_share']) for r in rows if r.get('other_religions_share') is not None)
          assert 40.0 < mng < 42.0, mng
          assert 40_000_000 < chn_other < 50_000_000, chn_other
          assert 30_000_000 < ind_other < 40_000_000, ind_other
          assert chn_unaff > 1_000_000_000, chn_unaff
          assert 30 < max_other < 40, max_other
          print({'Mongolia_unaffiliated_share':mng,'China_other_total':chn_other,'India_other_total':ind_other,'China_unaffiliated_total':chn_unaff,'max_other_share':max_other})
          PY
      - name: Persist validated parser fix
        if: ${{ steps.patch.outputs.changed == 'true' }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/import-pew-religion.py
          git commit -m 'Treat official Pew percentage sheet as 0-100 values'
          git push
      - name: Repair production Pew observations once
        if: ${{ steps.patch.outputs.changed == 'true' }}
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL secret is missing"; exit 1; }
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}" || { echo "::error::Supabase service-role secret is missing"; exit 1; }
          PYTHONPATH=scripts python scripts/import-pew-religion.py

  import:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r scripts/requirements-data-importers.txt
      - name: Run importer fixtures
        run: PYTHONPATH=scripts python scripts/test-pew-religion-importer.py
      - name: Import candidates
        run: PYTHONPATH=scripts python scripts/import-pew-religion.py
