name: Inspect FIFA association statistics JSON

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v16-2-7-inspect-fifa-stats-json.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Locate exact all-time statistics objects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,json,re,urllib.request
          for code in ['ENG','GER','IND','BRA','USA']:
              url=f'https://inside.fifa.com/en/associations/{code}'
              req=urllib.request.Request(url,headers={'User-Agent':'GeoStats/16.2.7 source validation'})
              with urllib.request.urlopen(req,timeout=30) as r: page=r.read().decode('utf-8','replace')
              m=re.search(r'<script[^>]+id=["\']__NEXT_DATA__["\'][^>]*>(.*?)</script>',page,re.S|re.I)
              data=json.loads(html.unescape(m.group(1)))
              hits=[]
              def walk(x,path='root'):
                  if isinstance(x,dict):
                      keys=' '.join(str(k) for k in x).lower()
                      vals=' '.join(str(v) for v in x.values() if isinstance(v,(str,int,float))).lower()
                      if ('appearance' in keys or 'appearance' in vals or 'best performance' in vals or 'last performance' in vals) and len(vals)<4000:
                          hits.append((path,{k:v for k,v in x.items() if isinstance(v,(str,int,float,bool,type(None)))}))
                      for k,v in x.items(): walk(v,f'{path}.{k}')
                  elif isinstance(x,list):
                      for i,v in enumerate(x): walk(v,f'{path}[{i}]')
              walk(data)
              print('===',code,'HITS',len(hits),'===')
              for path,obj in hits[:160]: print(path,obj)
          PY