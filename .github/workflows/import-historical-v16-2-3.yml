name: Import v16.2.3 historical categories and finalize

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geostats-v16-2-3-catalog-recovery
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Supabase credentials
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL secret is missing"; exit 1; }
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}" || { echo "::error::Supabase service-role secret is missing"; exit 1; }

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run v16.2.3 focused tests
        run: |
          node scripts/test-v16-2-3-static.cjs
          python scripts/test-historical-importer.py
          python scripts/test-source-integrity.py

  import_and_audit:
    needs: [preflight, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: unmembership
            label: UN membership history
          - source: constitute
            label: Constitute constitutional history
          - source: ipu
            label: IPU independence and universal suffrage history
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-data-importers.txt
      - name: Import official historical source
        run: python scripts/import-historical-categories.py --source ${{ matrix.source }} --require-complete
      - name: Independently re-audit historical source
        run: >-
          python scripts/audit-source-integrity.py
          --source ${{ matrix.source }}
          --include-nonplayable
          --fail-on-source-error
          --fail-on-empty
          --report-dir artifacts/source-integrity/${{ matrix.source }}
      - name: Upload historical source audit
        uses: actions/upload-artifact@v7
        with:
          name: geostats-v16-2-3-source-audit-${{ matrix.source }}
          path: artifacts/source-integrity/${{ matrix.source }}
          retention-days: 30
          if-no-files-found: error

  finalize:
    needs: [preflight, tests, import_and_audit]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install finalization dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-data-importers.txt
      - name: Export guarded pre-promotion audit
        run: python scripts/export-v16-2-category-audit.py --phase pre --release-version 16.2.3
      - name: Publish the shared Daily and Random catalog
        run: python scripts/finalize-v16-catalog.py --release-version 16.2.3
      - name: Export final catalog audit
        run: python scripts/export-v16-2-category-audit.py --phase final --release-version 16.2.3
      - name: Upload v16.2.3 category audit
        uses: actions/upload-artifact@v7
        with:
          name: geostats-v16-2-3-category-audit
          path: |
            category-audit-pre-promotion-v16-2-3.csv
            category-promotion-dry-run-v16-2-3.csv
            category-audit-pre-promotion-v16-2-3-summary.json
            category-audit-v16-2-3.csv
            category-promotion-final-v16-2-3.csv
            category-audit-v16-2-3-summary.json
          retention-days: 30
          if-no-files-found: error
