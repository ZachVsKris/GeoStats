name: Recover v16.2 audited catalog

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geostats-v16-2-catalog-recovery
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install repository dependencies
        run: |
          npm install --include=dev --no-audit --no-fund
          python -m pip install --disable-pip-version-check \
            -r scripts/requirements-data-importers.txt \
            -r scripts/requirements-faostat.txt \
            -r scripts/requirements-geography.txt
      - name: Test v16.2 generator, one-catalog policy, audit, and importers
        run: npm run test-v16-2

  recover:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: World Bank legacy catalog
            command: python scripts/recover-world-bank-catalog.py --refresh-values
            geography: false
          - name: FAOSTAT production and livestock populations
            command: python scripts/import-faostat.py
            geography: false
          - name: WHO health catalog
            command: python scripts/import-who.py
            geography: false
          - name: UN Comtrade exports
            command: python scripts/import-comtrade.py
            geography: false
          - name: UNHCR displacement
            command: python scripts/import-unhcr.py
            geography: false
          - name: Natural Earth geography
            command: python scripts/import-natural-earth.py
            geography: true
          - name: Pew religion
            command: python scripts/import-pew-religion.py
            geography: false
          - name: FAOSTAT Food Balances
            command: python scripts/import-faostat-food-balances.py
            geography: false
          - name: Smithsonian volcanoes
            command: python scripts/import-smithsonian-volcanoes.py
            geography: false
          - name: USGS earthquakes
            command: python scripts/import-usgs-earthquakes.py
            geography: true
    name: Recover ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install importer dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r scripts/requirements-data-importers.txt \
            -r scripts/requirements-faostat.txt
          if [ "${{ matrix.geography }}" = "true" ]; then
            python -m pip install --disable-pip-version-check -r scripts/requirements-geography.txt
          fi
      - name: Refresh official source data
        run: ${{ matrix.command }}

  audit:
    needs: recover
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        source: [worldbank, who, comtrade, unhcr, naturalearth, pew, faostatfbs, smithsonian, usgs]
    name: Audit ${{ matrix.source }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r scripts/requirements-data-importers.txt \
            -r scripts/requirements-faostat.txt \
            -r scripts/requirements-geography.txt
      - name: Recalculate official-source values, coverage, and rankings
        run: python scripts/audit-source-integrity.py --source ${{ matrix.source }} --include-nonplayable --report-dir artifacts/source-integrity/${{ matrix.source }}
      - name: Upload source audit
        uses: actions/upload-artifact@v4
        with:
          name: geostats-v16-2-source-audit-${{ matrix.source }}
          path: artifacts/source-integrity/${{ matrix.source }}
          retention-days: 30

  finalize:
    needs: [tests, recover, audit]
    if: ${{ always() && needs.tests.result == 'success' && needs.recover.result == 'success' && needs.audit.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install finalization dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-data-importers.txt
      - name: Vet newly imported candidates
        run: python scripts/vet-expanded-catalog.py --source expansion
      - name: Export pre-promotion audit and dry run
        run: python scripts/export-v16-2-category-audit.py --phase pre
      - name: Apply conservative promotions and publish one shared gameplay catalog
        run: python scripts/finalize-v16-catalog.py
      - name: Export final audit and applied decisions
        run: python scripts/export-v16-2-category-audit.py --phase final
      - name: Upload v16.2 catalog audit
        uses: actions/upload-artifact@v4
        with:
          name: geostats-v16-2-category-audit
          path: |
            category-audit-pre-promotion-v16-2.csv
            category-promotion-dry-run-v16-2.csv
            category-audit-pre-promotion-v16-2-summary.json
            category-audit-v16-2.csv
            category-promotion-final-v16-2.csv
            category-audit-v16-2-summary.json
          retention-days: 30
