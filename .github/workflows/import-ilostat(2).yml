name: Import ILOSTAT candidates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geostats-ilostat-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out GeoStats
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test importer framework
        run: python scripts/test-data-pipeline.py
      - name: Test ILOSTAT importer
        run: python scripts/test-ilostat-importer.py
      - name: Import ILOSTAT into review quarantine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/import-ilostat.py
