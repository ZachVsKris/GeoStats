name: Export current GeoStats repo for handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v16-2-7-export-handoff.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Archive pre-export main snapshot
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output GeoStats_CURRENT_GITHUB_MAIN_2026-08-28.zip HEAD^
      - uses: actions/upload-artifact@v7
        with:
          name: geostats-current-main-handoff
          path: GeoStats_CURRENT_GITHUB_MAIN_2026-08-28.zip
          retention-days: 7
