name: Verify GeoStats v15.9.2

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: geostats-v15-9-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Install Python importer dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r scripts/requirements-data-importers.txt \
            -r scripts/requirements-faostat.txt \
            -r scripts/requirements-geography.txt
      - name: Verify v15.9.2 repository, generators, automatic importers, and review rules
        run: npm run test-v15-9
      - name: Type-check the complete application
        run: npm run typecheck
      - name: Run importer unit tests
        run: npm run test-importers
      - name: Run source-policy fixtures
        run: npm run test-player-links && npm run test-source-integrity
      - name: Verify pinned Natural Earth data against real source geometry
        run: npm run test-natural-earth-real-data
      - name: Build production app
        run: npm run build
      - name: Install Chromium for responsive browser tests
        run: npx playwright install --with-deps chromium
      - name: Test Scout, Adventurer, Expert, legacy redirects, and 13-inch layout in Chromium
        run: npm run test-e2e
