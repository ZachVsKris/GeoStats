name: Inspect live FIFA tournament payload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v16-2-7-inspect-fifa-live-payload.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print exact official FIFA tournament and ranking shapes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, json, re, urllib.request

          def scalar_tree(value, depth=0):
              if depth > 4:
                  return '<depth-limit>'
              if isinstance(value, dict):
                  return {key: scalar_tree(item, depth + 1) for key, item in value.items()}
              if isinstance(value, list):
                  return [scalar_tree(item, depth + 1) for item in value[:5]]
              return value

          for code in ['ALG','BRA','USA','GER','IND']:
              url=f'https://inside.fifa.com/en/associations/{code}'
              req=urllib.request.Request(url,headers={'User-Agent':'GeoStats/16.2.7 source validation'})
              with urllib.request.urlopen(req,timeout=45) as response:
                  page=response.read().decode('utf-8','replace')
              match=re.search(r'<script[^>]+id=["\']__NEXT_DATA__["\'][^>]*>(.*?)</script>',page,re.S|re.I)
              payload=json.loads(html.unescape(match.group(1)))
              page_props=payload.get('props',{}).get('pageProps',{})
              association=page_props.get('association')
              print('===',code,'PAGE_PROPS_KEYS',sorted(page_props),'ASSOCIATION_TYPE',type(association).__name__,'===')
              if not isinstance(association,dict):
                  continue
              data=association.get('pageData',{})
              print('PAGE_DATA_KEYS',sorted(data))
              print('IDENTITY',{key:data.get(key) for key in ['associationName','name','countryName','code']})
              print('TOURNAMENTS',json.dumps(scalar_tree(data.get('honoursBestPerformances',{})),ensure_ascii=False,sort_keys=True))
              ranking=data.get('memberAssociationsGroupedRankingProps',{}).get('footballCountryRankings',{}).get('countryRankingSection',{}).get('rankings',{}).get('menRanking',{})
              print('MEN_RANKING',json.dumps(scalar_tree(ranking),ensure_ascii=False,sort_keys=True))
          PY
