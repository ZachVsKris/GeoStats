name: Generate v16.2.4 package lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Generate lockfile from pinned package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile resolves cleanly
        run: npm ci --ignore-scripts --include=dev --no-audit --no-fund
      - name: Upload package-lock.json
        uses: actions/upload-artifact@v7
        with:
          name: geostats-v16-2-4-package-lock
          path: package-lock.json
          retention-days: 30
          if-no-files-found: error
