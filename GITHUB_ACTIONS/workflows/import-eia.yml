name: Import EIA candidates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geostats-eia-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out GeoStats
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test generic importer framework
        run: python scripts/test-data-pipeline.py
      - name: Test EIA importer rules
        run: python scripts/test-eia-importer.py
      - name: Import EIA into review quarantine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/import-eia.py
