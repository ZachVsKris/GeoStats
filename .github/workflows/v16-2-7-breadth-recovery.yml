name: v16.2.7 authoritative breadth recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v16-2-7-breadth-recovery.yml'
      - 'scripts/import-natural-earth.py'
      - 'scripts/import-historical-categories.py'
      - 'scripts/import-natural-earth-capitals.py'
      - 'scripts/import-unesco-ich.py'
      - 'scripts/import-world-bank-infrastructure.py'
      - 'scripts/import-world-bank-climate.py'
      - 'scripts/import-un-wpp.py'
      - 'scripts/audit-source-integrity.py'

permissions:
  contents: read

concurrency:
  group: geostats-v16-2-7-authoritative-breadth-recovery
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  import-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: naturalearth
            command: python scripts/import-natural-earth.py
          - slug: unmembership
            command: python scripts/import-historical-categories.py --source unmembership --require-complete
          - slug: constitute
            command: python scripts/import-historical-categories.py --source constitute
          - slug: ipu
            command: python scripts/import-historical-categories.py --source ipu --require-complete
          - slug: worldbankhistory
            command: python scripts/import-historical-categories.py --source worldbankhistory --require-complete
          - slug: naturalearthcapitals
            command: python scripts/import-natural-earth-capitals.py
          - slug: unescoich
            command: python scripts/import-unesco-ich.py
          - slug: worldbankinfra
            command: python scripts/import-world-bank-infrastructure.py
          - slug: worldbankclimate
            command: python scripts/import-world-bank-climate.py
          - slug: unwpp
            command: python scripts/import-un-wpp.py
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require production warehouse credentials
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL secret is missing"; exit 1; }
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}" || { echo "::error::Supabase service-role secret is missing"; exit 1; }
      - name: Install importer dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r scripts/requirements-data-importers.txt \
            -r scripts/requirements-faostat.txt \
            -r scripts/requirements-geography.txt
      - name: Import ${{ matrix.slug }}
        shell: bash
        run: |
          set +e
          ${{ matrix.command }}
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::notice::Importer failed once; retrying after 10s to tolerate transient Supabase clock/auth or network errors."
            sleep 10
            ${{ matrix.command }}
          fi
      - name: Independently audit ${{ matrix.slug }}
        run: python scripts/audit-source-integrity.py --source ${{ matrix.slug }} --include-nonplayable --fail-on-source-error --fail-on-empty --report-dir artifacts/source-integrity/${{ matrix.slug }}
      - name: Upload ${{ matrix.slug }} evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-integrity-${{ matrix.slug }}
          path: artifacts/source-integrity/${{ matrix.slug }}
          if-no-files-found: warn
          retention-days: 30

  stage-only:
    needs: import-and-audit
    if: ${{ always() && needs.import-and-audit.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-data-importers.txt
      - name: Stage newly strict-pass candidates without publishing
        run: python scripts/stage-v16-2-7-catalog.py
