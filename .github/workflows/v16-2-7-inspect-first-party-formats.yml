name: v16.2.7 inspect first-party bulk formats

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v16-2-7-inspect-first-party-formats.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download exact first-party files and print schema samples
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            'https://thedocs.worldbank.org/en/doc/be6615202d1f08a25855c8ac2d615122-0050012025/related/GlobalFindexDatabase2025.csv' \
            -o /tmp/findex.csv
          curl --fail --location --retry 4 --retry-all-errors \
            'https://hdr.undp.org/sites/default/files/2025_HDR/HDR25_Composite_indices_complete_time_series.csv' \
            -o /tmp/undp.csv
          python - <<'PY'
          import csv
          from pathlib import Path

          with open('/tmp/findex.csv', newline='', encoding='utf-8-sig') as f:
              r=csv.DictReader(f)
              print('FINDEX_HEADERS=', r.fieldnames)
              rows=[]
              for row in r:
                  rows.append(row)
                  if len(rows)>=4: break
              for i,row in enumerate(rows,1):
                  print('FINDEX_ROW', i, {k: row.get(k) for k in r.fieldnames[:20]})
              print('FINDEX_RELEVANT_HEADERS=', [h for h in (r.fieldnames or []) if any(x in h.lower() for x in ('account','mobile','phone','merchant','save','borrow','wage','government','utility','emergency','digital','code','group','economy'))][:120])

          with open('/tmp/undp.csv', newline='', encoding='utf-8-sig') as f:
              r=csv.DictReader(f)
              headers=r.fieldnames or []
              print('UNDP_HEADER_COUNT=', len(headers))
              print('UNDP_FIRST_HEADERS=', headers[:60])
              print('UNDP_RELEVANT_HEADERS=', [h for h in headers if any(h.lower().startswith(p) for p in ('hdi_','ihdi_','loss_','coef_ineq_','ineq_le_','ineq_edu_','ineq_inc_','gdi_','gii_','phdi_','mpi_','pop_mpi_','intensity_','hdi_f_','hdi_m_'))][:160])
              rows=[]
              for row in r:
                  rows.append(row)
                  if len(rows)>=2: break
              for i,row in enumerate(rows,1):
                  keys=['iso3','country','Country','Country or Area','country_code','Country Code']
                  sample={k:row.get(k) for k in keys if k in row}
                  for h in headers:
                      if h in ('hdi_2023','ihdi_2023','loss_2023','coef_ineq_2023','ineq_le_2023','ineq_edu_2023','ineq_inc_2023','gdi_2023','gii_2023','phdi_2023','hdi_f_2023','hdi_m_2023'):
                          sample[h]=row.get(h)
                  print('UNDP_ROW', i, sample)
          PY
