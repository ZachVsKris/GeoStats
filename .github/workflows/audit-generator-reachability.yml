name: Audit v16.2.7 production generator reachability

on:
  workflow_dispatch:
    inputs:
      anchor_samples:
        description: "Cheap anchor-selection samples per difficulty"
        required: false
        default: "30000"
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-generator-reachability.yml'
      - 'scripts/audit-v16-2-7-reachability.cjs'
      - 'scripts/fingerprint-v16-2-7-catalog.cjs'
      - 'supabase/migrations/063_v16_2_7_durable_exclusion_hard_gate.sql'
      - 'supabase/migrations/066_v16_2_7_balanced_incremental_publication_gate.sql'
  workflow_run:
    workflows:
      - "v16.2.7 first-party bulk recovery"
      - "v16.2.7 authoritative history recovery"
      - "GeoStats v16.2.7 authoritative breadth recovery"
      - "v16.2.7 authoritative breadth recovery"
      - "v16.2.7 official UN SDG bulk recovery"
      - "Import Natural Earth geography"
      - "Import Smithsonian volcano candidates"
      - "Import USGS earthquake candidates"
    types: [completed]

permissions:
  contents: read

concurrency:
  group: geostats-v16-2-7-production-catalog
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require production warehouse credentials
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL secret is missing"; exit 1; }
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}" || { echo "::error::Supabase service-role secret is missing"; exit 1; }
      - name: Install JavaScript dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Freeze production catalog fingerprint
        run: node scripts/fingerprint-v16-2-7-catalog.cjs --write=/tmp/geostats-v16-2-7-catalog-fingerprint.json
      - name: Audit every strict-pass category in Scout, Adventurer, and Expert
        run: node scripts/audit-v16-2-7-reachability.cjs --write --assert-release --anchor-samples=${{ inputs.anchor_samples || '30000' }}
      - name: Prove production catalog did not mutate during audit
        if: always()
        run: node scripts/fingerprint-v16-2-7-catalog.cjs --compare=/tmp/geostats-v16-2-7-catalog-fingerprint.json
      - name: Publish only after the guarded v16.2.7 assertion passes
        run: python scripts/finalize-v16-catalog.py --release-version 16.2.7
