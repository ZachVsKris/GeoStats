name: Patch v16.2.7 Constitute eligible universe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v16-2-7-patch-constitute-subset.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Mark the resolved Constitute universe explicitly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/import-historical-categories.py')
          s=p.read_text()
          old='''        if len(rows) < candidate.rule.min_coverage:\n            raise RuntimeError(f"Constitute in-force constitutions service resolved only {len(rows)} unambiguous current-country records.")\n        return rows\n\n    def category_id(self, candidate: CandidateDefinition) -> str:\n        return "history:oldest-current-constitution"\n'''
          new='''        if len(rows) < candidate.rule.min_coverage:\n            raise RuntimeError(f"Constitute in-force constitutions service resolved only {len(rows)} unambiguous current-country records.")\n        # Constitute does not currently resolve one unambiguous in-force record\n        # for every GeoStats sovereign. Treat the documented, fully observed\n        # records as the legitimate ranked universe instead of pretending the\n        # missing countries have synthetic dates. This is especially important\n        # for a lowest-wins chronology, where missing early dates could corrupt\n        # the global ranking.\n        _mark_defined_subset(\n            candidate, rows,\n            "Current countries for which Constitute resolves exactly one unambiguous constitution explicitly marked in_force=true.",\n            "Countries without exactly one unambiguous current in-force Constitute record are outside this chronology rather than assigned a synthetic enactment year.",\n        )\n        return rows\n\n    def category_id(self, candidate: CandidateDefinition) -> str:\n        return "history:oldest-current-constitution"\n'''
          if old not in s: raise SystemExit('Constitute patch anchor not found')
          p.write_text(s.replace(old,new,1))

          t=Path('scripts/test-historical-importer.py')
          q=t.read_text()
          anchor='''assert cc.rule.ranking_direction == "low"\nIPU_FIXTURE = {\n'''
          replacement='''assert cc.rule.ranking_direction == "low"\n# The production Constitute importer must explicitly define the ranked subset\n# after resolving current in-force records; lowest-wins cannot assume missing\n# countries have later constitutions.\nwith patch.object(co, "_payload", return_value=CONSTITUTE_FIXTURE):\n    constitute_rows = co.fetch_observations(cc)\nassert cc.metadata["eligible_universe_type"] == "defined_subset"\nassert cc.metadata["eligible_country_count"] == len(constitute_rows)\nassert set(cc.metadata["eligible_country_iso3"]) == {row.country_iso3 for row in constitute_rows}\nIPU_FIXTURE = {\n'''
          if anchor not in q: raise SystemExit('historical test patch anchor not found')
          t.write_text(q.replace(anchor,replacement,1))
          PY
          python scripts/test-historical-importer.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/import-historical-categories.py scripts/test-historical-importer.py
          git commit -m 'Define Constitute chronology eligible universe'
          git push