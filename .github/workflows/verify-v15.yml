name: Verify GeoStats v15.7

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: geostats-v15-7-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Install Python importer dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r scripts/requirements-data-importers.txt \
            -r scripts/requirements-faostat.txt \
            -r scripts/requirements-geography.txt
      - name: Verify clean v15.7 repository and generator
        run: npm run test-v15-7
      - name: Type-check the complete application
        run: npm run typecheck
      - name: Run importer unit tests
        run: npm run test-importers
      - name: Run source-policy fixtures
        run: npm run test-player-links && npm run test-source-integrity
      - name: Build production app
        run: npm run build
