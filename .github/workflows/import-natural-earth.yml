name: Import Natural Earth geography

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geostats-natural-earth-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out GeoStats
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-geography.txt
      - name: Install geography dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-geography.txt
      - name: Test importer framework
        run: python scripts/test-data-pipeline.py
      - name: Test Natural Earth importer
        run: python scripts/test-natural-earth-importer.py
      - name: Import Natural Earth geography into review quarantine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/import-natural-earth.py
