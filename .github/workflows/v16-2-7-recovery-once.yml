name: v16.2.7 WPP repair and reachability rerun

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v16-2-7-recovery-once.yml'

permissions:
  contents: read

concurrency:
  group: geostats-v16-2-7-recovery-once
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  repair-wpp-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require production warehouse credentials
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL secret is missing"; exit 1; }
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}" || { echo "::error::Supabase service-role secret is missing"; exit 1; }
      - name: Install dependencies
        run: |
          npm ci --include=dev --no-audit --no-fund
          python -m pip install --disable-pip-version-check \
            -r scripts/requirements-data-importers.txt \
            -r scripts/requirements-faostat.txt \
            -r scripts/requirements-geography.txt
      - name: Verify WPP importer regression fixture
        run: python scripts/test-un-wpp-importer.py
      - name: Refresh repaired WPP source
        run: python scripts/import-un-wpp.py
      - name: Independently audit WPP source
        run: python scripts/audit-source-integrity.py --source unwpp --include-nonplayable --fail-on-source-error --fail-on-empty --report-dir artifacts/source-integrity/unwpp
      - name: Stage strict-pass candidates without publishing
        run: python scripts/stage-v16-2-7-catalog.py
      - name: Write production-solver reachability and diversity evidence
        id: reachability
        continue-on-error: true
        run: node scripts/audit-v16-2-7-reachability.cjs --write --anchor-samples=30000
      - name: Report reachability outcome
        run: |
          echo "Reachability audit outcome: ${{ steps.reachability.outcome }} (publication intentionally not attempted)."
      - name: Upload WPP audit evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: geostats-v16-2-7-wpp-repair-audit
          path: artifacts/source-integrity/unwpp
          retention-days: 30
          if-no-files-found: warn
