name: Import UNHCR candidates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geostats-unhcr-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out GeoStats
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test generic importer framework
        run: python scripts/test-data-pipeline.py
      - name: Test UNHCR importer rules
        run: python scripts/test-unhcr-importer.py
      - name: Import UNHCR into review quarantine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/import-unhcr.py
