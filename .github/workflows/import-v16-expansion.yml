name: Import v16.1 audited catalog

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geostats-v16-1-audited-catalog
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install JavaScript dependencies
        run: npm install --include=dev --no-audit --no-fund
      - name: Install importer dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r scripts/requirements-data-importers.txt \
            -r scripts/requirements-geography.txt
      - name: Test v16.1 audit, generator, and import pipeline
        run: npm run test-v16-1

  import:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Correct WHO clean-cooking proportion
            command: python scripts/import-who.py --rule highest-clean-fuel-access
            geography: false
          - name: Pew religion
            command: python scripts/import-pew-religion.py
            geography: false
          - name: FAOSTAT Food Balances
            command: python scripts/import-faostat-food-balances.py
            geography: false
          - name: Tourism and migration
            command: python scripts/import-tourism-migration.py
            geography: false
          - name: Smithsonian volcanoes
            command: python scripts/import-smithsonian-volcanoes.py
            geography: false
          - name: USGS earthquakes
            command: python scripts/import-usgs-earthquakes.py
            geography: true
          - name: Natural Earth geography
            command: python scripts/import-natural-earth.py
            geography: true
    name: Import ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install importer dependencies
        run: |
          python -m pip install --disable-pip-version-check -r scripts/requirements-data-importers.txt
          if [ "${{ matrix.geography }}" = "true" ]; then
            python -m pip install --disable-pip-version-check -r scripts/requirements-geography.txt
          fi
      - name: Run automatic official-source importer
        run: ${{ matrix.command }}

  vet:
    needs: [tests, import]
    if: ${{ always() && needs.tests.result == 'success' && needs.import.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install vetting dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-data-importers.txt
      - name: Vet every successfully imported expansion category
        run: python scripts/vet-expanded-catalog.py --source expansion
      - name: Apply v16.1 copy corrections, semantic audit, and ranking completeness
        run: python scripts/finalize-v16-catalog.py
      - name: Export the complete category-by-category audit
        run: python scripts/export-v16-1-category-audit.py
      - name: Upload complete catalog audit
        uses: actions/upload-artifact@v4
        with:
          name: geostats-v16-1-category-audit
          path: |
            category-audit-v16-1.csv
            category-audit-v16-1-summary.json
          retention-days: 30
