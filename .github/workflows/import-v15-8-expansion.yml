name: Import v15.8 expansion candidates

on:
  workflow_dispatch:
    inputs:
      aquastat_csv_url:
        description: Official AQUASTAT bulk CSV URL
        required: false
        type: string
      usgs_minerals_csv_url:
        description: Official USGS world mine-production CSV URL
        required: false
        type: string
      fisheries_csv_url:
        description: Normalized CSV derived from official FishStat exports
        required: false
        type: string
      worldcover_csv_url:
        description: Country-summary CSV derived from one ESA WorldCover release
        required: false
        type: string
      hydrosheds_csv_url:
        description: Country-summary CSV derived from one HydroSHEDS release
        required: false
        type: string
      elevation_csv_url:
        description: Country-summary CSV derived from one fixed elevation grid
        required: false
        type: string

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install importer dependencies
        run: pip install -r scripts/requirements-data-importers.txt
      - name: Test expansion importers and vetting
        run: npm run test-expansion-importers
      - name: Import Pew religious-composition candidates
        run: python scripts/import-pew-religion.py
      - name: Import Smithsonian volcano candidates
        run: python scripts/import-smithsonian-volcanoes.py
      - name: Import USGS earthquake candidates
        run: python scripts/import-usgs-earthquakes.py
      - name: Refresh Natural Earth physical candidates
        run: python scripts/import-natural-earth.py
      - name: Import UNESCO World Heritage candidates
        run: python scripts/import-unesco-world-heritage.py
      - name: Import AQUASTAT candidates
        if: ${{ inputs.aquastat_csv_url != '' }}
        run: python scripts/import-aquastat.py --input "${{ inputs.aquastat_csv_url }}"
      - name: Import USGS mineral-production candidates
        if: ${{ inputs.usgs_minerals_csv_url != '' }}
        run: python scripts/import-usgs-minerals.py --input "${{ inputs.usgs_minerals_csv_url }}"
      - name: Import FAO fisheries candidates
        if: ${{ inputs.fisheries_csv_url != '' }}
        run: python scripts/import-fao-fisheries.py --input "${{ inputs.fisheries_csv_url }}"
      - name: Import WorldCover country summaries
        if: ${{ inputs.worldcover_csv_url != '' }}
        run: python scripts/import-physical-summaries.py --source worldcover --input "${{ inputs.worldcover_csv_url }}"
      - name: Import HydroSHEDS country summaries
        if: ${{ inputs.hydrosheds_csv_url != '' }}
        run: python scripts/import-physical-summaries.py --source hydrosheds --input "${{ inputs.hydrosheds_csv_url }}"
      - name: Import elevation country summaries
        if: ${{ inputs.elevation_csv_url != '' }}
        run: python scripts/import-physical-summaries.py --source elevation --input "${{ inputs.elevation_csv_url }}"
      - name: Vet all expansion candidates
        run: python scripts/vet-expanded-catalog.py --source expansion
