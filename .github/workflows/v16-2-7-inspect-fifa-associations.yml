name: Inspect FIFA association records

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v16-2-7-inspect-fifa-associations.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect official FIFA member-association directory and record pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request
          urls=['https://inside.fifa.com/en/associations','https://inside.fifa.com/en/about-fifa/associations']
          for url in urls:
              req=urllib.request.Request(url,headers={'User-Agent':'GeoStats/16.2.7 source validation'})
              with urllib.request.urlopen(req,timeout=30) as r: text=r.read().decode('utf-8','replace')
              print('DIRECTORY',url,'bytes',len(text))
              paths=sorted(set(re.findall(r'href=["\']([^"\']*?/associations/[A-Za-z]{3})(?:[/?#"\']|$)',text,re.I)))
              codes=sorted(set(re.findall(r'/associations/([A-Za-z]{3})(?:[/?#"\']|$)',text,re.I)))
              print('PATH_COUNT',len(paths),'CODE_COUNT',len(codes),'CODES',codes[:250])
              print('HAS_NEXT_DATA', '__NEXT_DATA__' in text, 'HAS_WC_TEXT', 'FIFA World Cup' in text)
          for code in ['ENG','IND','USA','CRO','BRA','GER','SUI','NED','KOR','RSA']:
              url=f'https://inside.fifa.com/en/associations/{code}'
              req=urllib.request.Request(url,headers={'User-Agent':'GeoStats/16.2.7 source validation'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: text=r.read().decode('utf-8','replace')
              except Exception as e:
                  print('PAGE_FAIL',code,repr(e)); continue
              plain=re.sub(r'<[^>]+>',' ',text)
              plain=re.sub(r'\s+',' ',plain)
              idx=plain.find('FIFA World Cup')
              print('PAGE',code,'bytes',len(text),'wcidx',idx,'sample',plain[idx:idx+650] if idx>=0 else plain[:300])
          PY