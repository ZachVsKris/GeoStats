name: Import UN Comtrade candidates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geostats-comtrade-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out GeoStats
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test generic importer framework
        run: python scripts/test-data-pipeline.py
      - name: Test UN Comtrade importer rules
        run: python scripts/test-comtrade-importer.py
      - name: Import UN Comtrade into review quarantine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
        run: python scripts/import-comtrade.py
