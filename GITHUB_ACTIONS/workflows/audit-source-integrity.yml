name: Audit all source integrity

on:
  workflow_dispatch:
    inputs:
      source:
        description: Source to audit
        required: true
        default: all
        type: choice
        options:
          - all
          - worldbank
          - faostat
          - who
          - unesco
          - ilostat
          - naturalearth
          - comtrade
          - eia
          - unhcr
      include_nonplayable:
        description: Also audit disabled candidate categories
        required: true
        default: false
        type: boolean
      activate_enforcement:
        description: Turn on fail-closed enforcement after a complete audit
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: geostats-source-integrity-${{ inputs.source }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - name: Check out GeoStats
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check required Supabase secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo "Missing SUPABASE_URL"; exit 1; }
          if [ -z "${SUPABASE_SECRET_KEY:-}" ] && [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "Missing SUPABASE_SECRET_KEY or SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-data-importers.txt
          pip install -r scripts/requirements-faostat.txt
          pip install -r scripts/requirements-geography.txt

      - name: Run integrity fixture tests
        run: python scripts/test-source-integrity.py

      - name: Reimport and audit FAOSTAT bulk source
        if: ${{ inputs.source == 'all' || inputs.source == 'faostat' }}
        run: python scripts/import-faostat.py

      - name: Audit official sources
        if: ${{ inputs.source != 'faostat' }}
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "${{ inputs.include_nonplayable }}" = "true" ]; then EXTRA="--include-nonplayable"; fi
          ACTIVATE=""
          if [ "${{ inputs.activate_enforcement }}" = "true" ]; then ACTIVATE="--activate"; fi
          python scripts/audit-source-integrity.py --source "${{ inputs.source }}" $EXTRA $ACTIVATE

      - name: Activate enforcement after FAOSTAT-only audit
        if: ${{ inputs.source == 'faostat' && inputs.activate_enforcement }}
        run: python scripts/activate-source-integrity.py

      - name: Print integrity verification query
        if: always()
        run: |
          echo "Run VERIFY_V14_2.sql in Supabase to inspect verified, pending, failed, and unavailable categories."
