name: v16.2.7 bulk diagnostics

on:
  push:
    branches: [v16-2-7-bulk-diagnostics]
    paths:
      - '.github/workflows/v16-2-7-bulk-diagnostics.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Global Findex first-party documentation links
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            'https://www.worldbank.org/en/publication/globalfindex/download-data' \
            -o /tmp/page.html
          python - <<'PY'
          import re,html
          text=open('/tmp/page.html',encoding='utf-8',errors='replace').read()
          urls=[]
          for u in re.findall(r'https?://[^"\'<> ]+', text):
              u=html.unescape(u).replace('\\u0026','&')
              if any(k in u.lower() for k in ('findex','codebook','dictionary','.xlsx','.csv','.dta','.zip','.pdf')):
                  if u not in urls: urls.append(u)
          for u in urls: print(u)
          print('URL_COUNT',len(urls))
          PY
