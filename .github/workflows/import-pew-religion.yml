name: Import Pew religion candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-pew-religion.yml'
      - 'scripts/inspect-pew-schema.py'

permissions:
  contents: read

jobs:
  inspect:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install inspection dependency
        run: pip install openpyxl
      - name: Inspect exact first-party Pew archive
        run: python scripts/inspect-pew-schema.py

  import:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r scripts/requirements-data-importers.txt
      - name: Run importer fixtures
        run: PYTHONPATH=scripts python scripts/test-pew-religion-importer.py
      - name: Import quarantined candidates
        run: python scripts/import-pew-religion.py
