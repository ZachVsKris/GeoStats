name: Verify GeoStats v16.2.5

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: geostats-v16-2-5-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install JavaScript dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Install Python importer dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r scripts/requirements-data-importers.txt \
            -r scripts/requirements-faostat.txt \
            -r scripts/requirements-geography.txt
      - name: Verify v16.2.5 repository, catalog, performance wiring, history, generator, and importers
        run: npm run test-v16-2-5
      - name: Type-check application
        run: npm run typecheck
      - name: Run source-policy fixtures
        run: npm run test-player-links && npm run test-source-integrity
      - name: Verify pinned Natural Earth data
        run: npm run test-natural-earth-real-data
      - name: Build production app
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run responsive browser tests
        run: npm run test-e2e
