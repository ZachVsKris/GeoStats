name: Import all source data

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geostats-all-source-import
  cancel-in-progress: false

jobs:
  world-bank-catalog:
    name: World Bank catalog
    concurrency:
      group: geostats-world-bank-catalog-import
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/test-data-pipeline.py
      - run: python scripts/test-world-bank-catalog-importer.py
      - name: Import objective World Bank candidates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/import-world-bank-catalog.py --target-successes 500 --scan-limit 2000 --minimum-successes 100

  faostat:
    name: FAOSTAT
    concurrency:
      group: geostats-faostat-import
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-faostat.txt
      - run: python -m pip install --disable-pip-version-check -r scripts/requirements-faostat.txt
      - run: python scripts/test-faostat-importer.py
      - name: Import FAOSTAT
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/import-faostat.py

  who:
    name: WHO
    concurrency:
      group: geostats-who-import
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/test-data-pipeline.py
      - run: python scripts/test-who-importer.py
      - name: Import WHO
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/import-who.py

  unesco:
    name: UNESCO UIS
    concurrency:
      group: geostats-unesco-import
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/test-data-pipeline.py
      - run: python scripts/test-unesco-importer.py
      - name: Import UNESCO
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/import-unesco.py

  ilostat:
    name: ILOSTAT
    concurrency:
      group: geostats-ilostat-import
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/test-data-pipeline.py
      - run: python scripts/test-ilostat-importer.py
      - name: Import ILOSTAT
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/import-ilostat.py

  natural-earth:
    name: Natural Earth
    concurrency:
      group: geostats-natural-earth-import
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-geography.txt
      - run: python -m pip install --disable-pip-version-check -r scripts/requirements-geography.txt
      - run: python scripts/test-data-pipeline.py
      - run: python scripts/test-natural-earth-importer.py
      - name: Import Natural Earth
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/import-natural-earth.py --minimum-successes 24

  comtrade:
    name: UN Comtrade
    concurrency:
      group: geostats-comtrade-import
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/test-data-pipeline.py
      - run: python scripts/test-comtrade-importer.py
      - name: Import UN Comtrade when configured
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
        shell: bash
        run: |
          if [ -n "${COMTRADE_API_KEY:-}" ]; then
            python scripts/import-comtrade.py --minimum-successes 55
          else
            echo "COMTRADE_API_KEY is not configured; skipping Comtrade expansion."
          fi

  eia:
    name: U.S. EIA
    concurrency:
      group: geostats-eia-import
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/test-data-pipeline.py
      - run: python scripts/test-eia-importer.py
      - name: Import EIA when configured
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        shell: bash
        run: |
          if [ -n "${EIA_API_KEY:-}" ]; then
            python scripts/import-eia.py
          else
            echo "EIA_API_KEY is not configured; skipping EIA import."
          fi

  unhcr:
    name: UNHCR
    concurrency:
      group: geostats-unhcr-import
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/test-data-pipeline.py
      - run: python scripts/test-unhcr-importer.py
      - name: Import UNHCR
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/import-unhcr.py
