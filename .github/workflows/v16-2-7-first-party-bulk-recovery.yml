name: v16.2.7 first-party bulk recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v16-2-7-first-party-bulk-recovery.yml'
      - 'scripts/import-global-findex.py'
      - 'scripts/import-undp-hdr.py'
      - 'scripts/audit-current-bulk-importer.py'
      - 'scripts/test-global-findex-importer.py'
      - 'scripts/test-undp-hdr-importer.py'

permissions:
  contents: read

concurrency:
  group: geostats-v16-2-7-authoritative-breadth-recovery
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  GLOBAL_FINDEX_2025_INPUT: artifacts/v16-2-7-inputs/GlobalFindexDatabase2025.csv
  UNDP_HDR_INPUT: artifacts/v16-2-7-inputs/HDR25_Composite_indices_complete_time_series.csv

jobs:
  import-audit-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require production warehouse credentials
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL secret is missing"; exit 1; }
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}" || { echo "::error::Supabase service-role secret is missing"; exit 1; }
      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-data-importers.txt
      - name: Download exact first-party bulk releases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/v16-2-7-inputs
          curl --fail --location --retry 4 --retry-all-errors \
            'https://thedocs.worldbank.org/en/doc/be6615202d1f08a25855c8ac2d615122-0050012025/related/GlobalFindexDatabase2025.csv' \
            -o "$GLOBAL_FINDEX_2025_INPUT"
          curl --fail --location --retry 4 --retry-all-errors \
            'https://hdr.undp.org/sites/default/files/2025_HDR/HDR25_Composite_indices_complete_time_series.csv' \
            -o "$UNDP_HDR_INPUT"
          test -s "$GLOBAL_FINDEX_2025_INPUT"
          test -s "$UNDP_HDR_INPUT"
      - name: Import and independently audit curated Global Findex 2025 concepts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/import-global-findex.py --input "$GLOBAL_FINDEX_2025_INPUT"
          python scripts/audit-current-bulk-importer.py --source globalfindex2025
      - name: Import and independently audit curated UNDP HDR 2025 concepts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/import-undp-hdr.py --input "$UNDP_HDR_INPUT"
          python scripts/audit-current-bulk-importer.py --source undphdr
      - name: Stage newly strict-pass candidates without publishing
        run: python scripts/stage-v16-2-7-catalog.py
