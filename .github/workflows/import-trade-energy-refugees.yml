name: Import Comtrade, EIA & UNHCR

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geostats-v13-3-new-source-imports
  cancel-in-progress: false

jobs:
  comtrade:
    name: UN Comtrade
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/test-data-pipeline.py
      - run: python scripts/test-comtrade-importer.py
      - name: Import UN Comtrade
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
        run: python scripts/import-comtrade.py

  eia:
    name: U.S. EIA
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/test-data-pipeline.py
      - run: python scripts/test-eia-importer.py
      - name: Import EIA
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/import-eia.py

  unhcr:
    name: UNHCR
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/test-data-pipeline.py
      - run: python scripts/test-unhcr-importer.py
      - name: Import UNHCR
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/import-unhcr.py
