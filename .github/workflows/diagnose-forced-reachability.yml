name: Diagnose v16.2.7 forced reachability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-v16-2-7-reachability.cjs'
      - '.github/workflows/diagnose-forced-reachability.yml'

permissions:
  contents: read

# This job is deliberately read-only and may run beside the serialized
# production-catalog workflow. It never writes proof rows or publishes catalog
# state; it exists to reveal forced-solver blockers without the later, expensive
# Random/Daily distribution simulations.
concurrency:
  group: geostats-v16-2-7-forced-reachability-diagnostic
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Require production warehouse credentials
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL secret is missing"; exit 1; }
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}" || { echo "::error::Supabase service-role secret is missing"; exit 1; }
      - name: Install JavaScript dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Diagnose every forced category/difficulty pair without writes
        run: node scripts/audit-v16-2-7-reachability.cjs --forced-only
