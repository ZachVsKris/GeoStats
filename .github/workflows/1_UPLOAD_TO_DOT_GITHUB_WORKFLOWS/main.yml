name: Import all source data

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geostats-all-source-import
  cancel-in-progress: false

jobs:
  faostat:
    name: FAOSTAT
    concurrency:
      group: geostats-faostat-import
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-faostat.txt
      - run: python -m pip install --disable-pip-version-check -r scripts/requirements-faostat.txt
      - run: python scripts/test-faostat-importer.py
      - name: Import FAOSTAT
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/import-faostat.py

  who:
    name: WHO
    concurrency:
      group: geostats-who-import
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/test-data-pipeline.py
      - run: python scripts/test-who-importer.py
      - name: Import WHO
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/import-who.py

  unesco:
    name: UNESCO UIS
    concurrency:
      group: geostats-unesco-import
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/test-data-pipeline.py
      - run: python scripts/test-unesco-importer.py
      - name: Import UNESCO
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/import-unesco.py

  ilostat:
    name: ILOSTAT
    concurrency:
      group: geostats-ilostat-import
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/test-data-pipeline.py
      - run: python scripts/test-ilostat-importer.py
      - name: Import ILOSTAT
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/import-ilostat.py

  natural-earth:
    name: Natural Earth
    concurrency:
      group: geostats-natural-earth-import
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-geography.txt
      - run: python -m pip install --disable-pip-version-check -r scripts/requirements-geography.txt
      - run: python scripts/test-data-pipeline.py
      - run: python scripts/test-natural-earth-importer.py
      - name: Import Natural Earth
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/import-natural-earth.py
